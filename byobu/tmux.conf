# ~/.byobu/.tmux.conf  (symlinked from etc/public/byobu/tmux.conf)
#
# Converted from ../screen/screenrc to reproduce the GNU Screen look & feel
# under byobu's tmux backend.
#
# Byobu sources this file LAST (after its own profile), so everything here
# wins over byobu's defaults. Byobu already gives us, for free:
#   - prefix ^A  (+ F12), screen-style keybindings
#   - mode-keys vi
#   - monitor-activity on
# so we only override what differs from the screenrc.

### --- terminal ------------------------------------------------------------
# screenrc: term screen-256color  +  truecolor on
set  -g default-terminal "screen-256color"
# Append RGB/truecolor without clobbering byobu's terminal-overrides
# (which keeps Shift-PageUp/PageDown scrolling working).
set -as terminal-features ",*:RGB"

# tmux 3.8 flipped the built-in default to "mouse on", which makes tmux grab
# mouse events and breaks the terminal's native click-drag selection / middle
# click paste. Keep the screen behaviour: the terminal owns the mouse.
# (Byobu's Alt-F12 still toggles it at runtime.)
set  -g mouse off

# screenrc: maptimeout 5
set -sg escape-time 5

# screenrc: deflogin on  -> make each window/pane a login shell.
# NOTE: byobu normally uses a non-login $SHELL to avoid re-sourcing ~/.profile.
# Having "default-command" in this file is byobu's supported way to override it.
# If you ever get doubled PATHs etc., delete this line to use byobu's default.
set  -g default-command "exec ${SHELL} -l"

# screenrc: defscrollback 1000000
set  -g history-limit 1000000

### --- status line (screenrc: caption always ...) --------------------------
# Original:
#   caption always "%{#000000;#e6e6e6}%-w%{#ffffff;#ff6c5c}%n %t%{-}%+w %-= [ %0` %1` / %2` ] "
# i.e. window list (black on light grey), current window white on coral,
#      right-aligned:  [ YYYY-MM-DD HH:MM / <CET clock> ]
set  -g status on
set  -g status-interval 5
set  -g status-justify left
set  -g status-style "bg=#e6e6e6,fg=#000000"

# No session name on the left; window list starts at column 0 like screen.
set  -g status-left ""
set  -g status-left-length 0

# %0` = date, %1` = time (native tmux strftime), %2` = spain-time clock
set  -g status-right "[ %Y-%m-%d %H:%M / #(spain-time clock) ] "
set  -g status-right-length 100

# Window list: "<num> <name>", contiguous colored blocks like screen's caption.
set -wg window-status-separator ""
set -wg window-status-format         " #I #W "
set -wg window-status-style          "bg=#e6e6e6,fg=#000000"
set -wg window-status-current-format " #I #W "
set -wg window-status-current-style  "bg=#ff6c5c,fg=#ffffff"
set -wg window-status-activity-style "bg=#e6e6e6,fg=#000000,bold"

# screenrc: activity "Activity in %t(%n)"
set -wg monitor-activity on
set  -g visual-activity on

# Window titles from the shell (screen feel). Your ~/.bashrc line 8 emits the
# screen title escape:
#   PROMPT_COMMAND='printf "\033k%s\033\\" "${PWD/#$HOME/\~}"'
# tmux honors that escape, but byobu turns on automatic-rename (name = running
# command), which overrides it. Turn auto-rename off and allow apps to rename,
# so #W shows your PWD-based title just like screen's %t.
set -wg automatic-rename off
set  -g allow-rename on

### --- copy-mode navigation (screenrc: bindkey -m ...) ----------------------
# screen mapped Ctrl-Left/Right to word motions and Home/End to line motions.
set  -g mode-keys vi
bind -T copy-mode-vi C-Left  send -X previous-word
bind -T copy-mode-vi C-Right send -X next-word
bind -T copy-mode-vi Home    send -X start-of-line
bind -T copy-mode-vi End     send -X end-of-line

# screen-style selection: Enter starts the selection, Enter again copies.
# (byobu's vi default is Space=start, Enter=copy — this restores the ^A [ ,
# move, Enter, move, Enter flow.) Copy goes to the tmux buffer AND the Wayland
# clipboard, so ^A ] and other apps can both paste it.
bind -T copy-mode-vi Enter if-shell -F '#{selection_present}' \
    'send -X copy-pipe-and-cancel "wl-copy"' \
    'send -X begin-selection'
# 'y' also copies (vi habit), same destinations.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

### --- prefix & scrollback (screen feel) -----------------------------------
# Byobu 6.x sets BOTH prefix and prefix2 to F12 (its f-keys.tmux does
# `set -g prefix F12`), which clobbers the ^A that screen users expect and
# leaves Ctrl-a doing nothing. Restore Ctrl-a as the primary prefix; keep F12
# as prefix2 so byobu's F-key menu etc. still work.
set  -g prefix  C-a
set  -g prefix2 F12
bind a send-prefix            # Ctrl-a a -> literal Ctrl-a (screen: ^A a)

# Enter scrollback/copy-mode the screen way. tmux already binds `prefix [` and
# `prefix PageUp`; add `prefix Esc` so ^A Esc works like screen too.
bind Escape copy-mode
# (F7 with no prefix also enters copy-mode, courtesy of byobu.)

### --- new windows/panes open in $HOME (not the current path) ---------------
# Byobu binds new-window/split-window with -c "#{pane_current_path}", so new
# windows inherit the current dir. Re-bind the keys you'd actually use to open
# in $HOME instead. (#{HOME} is resolved by tmux at runtime.)
#   prefix keys (screen-style):
bind    c   new-window   -c "#{HOME}"
bind    C-c new-window   -c "#{HOME}"
bind    |   split-window -c "#{HOME}"
#   byobu F-keys:
bind -n F2   new-window   -c "#{HOME}" \; rename-window -
bind -n C-F2 display-panes \; split-window -h -c "#{HOME}"
bind -n S-F2 display-panes \; split-window -v -c "#{HOME}"

# screenrc feel: ^A S splits into stacked top/bottom regions (screen's "split").
# tmux panes are independent shells (not viewports onto windows like screen
# regions), so ^A S opens a NEW shell below. (^A | splits left/right.)
bind S split-window -v -c "#{HOME}"

# Closest thing to screen's "put an existing window into the other region":
# ^A J prompts for a window number and pulls that window in as a bottom split.
# Send it back out to its own tab with break-pane (^A !).
bind J command-prompt -p "join window into split:" "join-pane -v -s ':%%'"

# screen's command line: ^A : then `number N` renumbers the current window.
# tmux has no `number` command; alias it to swap-window so `number N` SWAPS the
# current window with window N (screen's behavior when N is in use -- the common
# reorder case). The -d flag makes focus follow YOUR tab to its new index N
# (without it you'd be left looking at the window that swapped in).
# NOTE: N must already exist; to park a window at an empty index use the builtin
# instead: ^A : then `move-window -t N`.
set -s command-alias[100] 'number=swap-window -d -t'

### --- key bindings ---------------------------------------------------------
# screenrc: bind K eval "clear" "scrollback 0" "scrollback 1000000"
#   -> reset the pane and wipe scrollback history.
bind K send-keys -R \; clear-history

# screenrc clipboard bridge (screenex_clip out/in) on Wayland.
#   ^A .  -> copy tmux's buffer to the system clipboard  (wl-copy)
#   ^A ,  -> paste the system clipboard into tmux         (wl-paste)
bind . run-shell "tmux save-buffer - | wl-copy"
bind , run-shell "wl-paste --no-newline | tmux load-buffer -" \; paste-buffer
